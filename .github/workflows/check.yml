name: check

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # mise refuses an untrusted config; this checkout is the repo itself.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-gate reads the commits between base and head
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # validate and test need no login (CHECKLIST A3). Keep this version >= MIN_CLAUDE in scripts/mise/lib.sh.
      - run: npm install -g @anthropic-ai/claude-code@2.1.314
      - run: mise run check
      - name: release-gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: mise run release-gate "$BASE" "$HEAD"
